<div class="welcome-container">
  <div class="login-card">
    <!-- Icono de carrito -->
    <div class="cart-icon">
      <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>
    </div>

    <!-- Título -->
    <h1 class="app-title">Crear Cuenta</h1>
    <p class="subtitle">Registrate para continuar comprando</p>

    <!-- Formulario de login -->
    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="login-form">
  <div class="form-group">
    <label for="email">Correo</label>
    <input id="email" type="email" formControlName="email" placeholder="Ingresa tu correo" />
  </div>

  <div class="form-group">
    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" placeholder="Mínimo 8 caracteres" />
  </div>

  <div class="form-group">
    <label for="name">Nombre</label>
    <input id="name" type="text" formControlName="name" placeholder="Ingresa tu nombre" />
  </div>

  <div *ngIf="errorMessage" class="error-msg">
    {{ errorMessage }}
  </div>

  <button type="submit" class="login-btn" [disabled]="loading">
    <span *ngIf="!loading">Crear Cuenta</span>
    <span *ngIf="loading">Cargando...</span>
  </button>
</form>


    <!-- Divisor -->
    <div class="divider">
      <span>o</span>
    </div>

    <!-- Opciones -->
    <div class="extra-options">
      <a routerLink="/login" class="link-btn">

        Iniciar Sesión
      </a>

    </div>
  </div>
</div>
