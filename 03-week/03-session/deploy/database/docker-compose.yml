version: '3.8'
services:
  app-movil-dev:
    container_name: app-movil-dev
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_DEV}
    ports:
      - "3307:3306"
    networks:
      - network_local_server
    volumes:
      - mysql_data_dev:/var/lib/mysql
      - "/home/ubuntu/db_backups/dev:/backups/mysql"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - com.corhuila.group=databases

  app-movil-qa:
    container_name: app-movil-qa
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_QA}
    ports:
      - "3308:3306"
    networks:
      - network_local_server
    volumes:
      - mysql_data_qa:/var/lib/mysql
      - "/home/ubuntu/db_backups/qa:/backups/mysql"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - com.corhuila.group=databases

  app-movil-prod:
    container_name: app-movil-prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD_PROD}
    ports:
      - "3309:3306"
    networks:
      - network_local_server
    volumes:
      - mysql_data_prod:/var/lib/mysql
      - "/home/ubuntu/db_backups/prod:/backups/mysql"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - com.corhuila.group=databases

volumes:
  mysql_data_dev:
    driver: local
  mysql_data_qa:
    driver: local
  mysql_data_prod:
    driver: local

networks:
  network_local_server:
    driver: bridge
    name: network_local_server