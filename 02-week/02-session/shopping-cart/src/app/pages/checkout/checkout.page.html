<!-- Encabezado -->
<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Checkout</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Tarjeta con el resumen de la compra -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Resumen de Compra</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <!-- Lista de productos en el carrito -->
      <ion-list>
        <ion-item *ngFor="let item of cartItems">
          {{ item.product.name }} x{{ item.quantity }} →
          \${{ item.product.price * item.quantity }}
        </ion-item>
      </ion-list>

      <!-- Total a pagar -->
      <h2>Total: \${{ total }}</h2>
    </ion-card-content>
  </ion-card>

  <!-- Botón para finalizar la compra -->
  <ion-button expand="block" (click)="finishPurchase()">
    Finalizar Compra
  </ion-button>
</ion-content>
